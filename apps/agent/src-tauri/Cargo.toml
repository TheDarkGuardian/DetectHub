[package]
name = "detecthub-agent"
version = "2.4.0"
description = "DetectHub Digital Forensics & Computer Integrity Desktop Agent"
authors = ["DetectHub Core Engineering Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "detecthub_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
